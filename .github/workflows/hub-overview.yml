name: Publish Hub overview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PATCH full_description on Docker Hub
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request
          text = open('hub-overview.md', encoding='utf-8').read()
          user = os.environ['HUB_USER']
          tok = os.environ['HUB_TOKEN']
          req = urllib.request.Request('https://hub.docker.com/v2/users/login/',
              data=json.dumps({'username': user, 'password': tok}).encode(),
              headers={'Content-Type': 'application/json'})
          token = json.load(urllib.request.urlopen(req))['token']
          r = urllib.request.Request('https://hub.docker.com/v2/repositories/%s/holostts-hybrid/' % user,
              data=json.dumps({'full_description': text}).encode(),
              method='PATCH',
              headers={'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'})
          resp = urllib.request.urlopen(r)
          print('status', resp.status, 'len', len(text))
          EOF
